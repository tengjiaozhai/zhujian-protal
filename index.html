<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>竹简应用中台</title><body>正在加载原型…<script>Promise.all(Array.from({length:14},(_,i)=>fetch("/part-"+String(i).padStart(2,"0")+".bin").then(r=>{if(!r.ok)throw Error("加载失败");return r.arrayBuffer()}))).then(parts=>{let n=parts.reduce((a,b)=>a+b.byteLength,0),bytes=new Uint8Array(n),offset=0;parts.forEach(b=>{bytes.set(new Uint8Array(b),offset);offset+=b.byteLength});let html=new TextDecoder().decode(bytes);document.open();document.write(html);document.close()}).catch(()=>document.body.textContent="加载失败，请刷新页面重试")</script></body></html>
